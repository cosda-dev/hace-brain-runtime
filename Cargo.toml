[package]
name    = "hace-brain-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "Brain Runtime — Zeus CE coordinator (routes BrainKernel to CE backends)"

[dependencies]
hace-brain-base = { path = "../base" }
hace-fem-hacedle = { path = "../../fem/hacedle", optional = true }
hace-uni-rand = { path = "../../uni/rand", optional = true }
async-trait     = "0.1"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
thiserror       = "1"
tokio           = { version = "1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["std"]
alloc   = []
std     = []   # CE.Hacedle backend (fem/hacedle)
hacedle = ["dep:hace-fem-hacedle", "hace-fem-hacedle/std"]
llama   = []   # CE.Llama backend (fem/llama)
remote  = []   # CE.Remote backend (io/racex)
